name: Refresh plugin universe

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/collect.py --refresh
      - run: python pipeline/build_map.py
      - name: Commit refreshed map
        run: |
          git config user.name "obsidian-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/community-plugins.json data/raw/community-plugin-stats.json public/map-v1.json
          git diff --cached --quiet || git commit -m "Refresh plugin universe"
          git push
